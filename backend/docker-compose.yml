services:
  backend:
    container_name: decathlon_backend
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "4000:4000"

    env_file:
      - .env

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"